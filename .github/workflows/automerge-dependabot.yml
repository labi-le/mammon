---
name: "Dependabot Automerge - Action"

on:
  workflow_run:
    workflows: ["Build"]
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: DependabotMerge
    runs-on: ubuntu-latest
    if: >-
      ${{ github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_repository.full_name == github.repository }}
    steps:
      - name: Merge the Dependabot PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          number=$(gh pr list --app dependabot --head "$HEAD_BRANCH" --state open \
            --json number,author,headRefOid,headRepository |
            jq -r --arg sha "$HEAD_SHA" --arg repo "$GH_REPO" \
              'map(select(.author.login == "app/dependabot" and .author.is_bot == true and .headRefOid == $sha and .headRepository.nameWithOwner == $repo)) | .[0].number // empty')

          if [ -z "$number" ]; then
            echo "no open dependabot PR at tested head $HEAD_SHA"
            exit 0
          fi

          if gh pr merge --merge --delete-branch --match-head-commit "$HEAD_SHA" "$number"; then
            exit 0
          fi
          current=$(gh pr view "$number" --json state,headRefOid)
          if ! jq -e --arg sha "$HEAD_SHA" '.state == "OPEN" and .headRefOid == $sha' <<<"$current" >/dev/null; then
            echo "PR #${number} is closed or changed since Build; nothing to rebase"
            exit 0
          fi
          comments=$(gh pr view "$number" --json comments --jq '.comments[].body')
          if grep -x '@dependabot rebase' <<<"$comments" >/dev/null; then
            echo "::error::#${number} still refuses to merge after a rebase"
            exit 1
          fi
          echo "::notice::merge refused for #${number}; asking dependabot to rebase"
          gh pr comment "$number" --body "@dependabot rebase"
