---
name: "Dependabot Automerge - Action"

on:
  workflow_run:
    workflows: ["Build"]
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: DependabotMerge
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    steps:
      - name: Merge the Dependabot PR
        run: |
          number=$(gh pr list --repo "$REPO" --head "$HEAD" \
            --state open --json number --jq '.[0].number')
          if [ -z "$number" ]; then
            echo "no open PR for $HEAD, nothing to merge"
            exit 0
          fi
          if gh pr merge --merge --delete-branch --repo "$REPO" "$number"; then
            exit 0
          fi
          # A branch whose base moved on is merged three-way, and GITHUB_TOKEN may
          # not write a workflow file that way. Dependabot may: its rebase lands a
          # fresh head, whose Build run brings us back here against a current base.
          # Asked once only - a second refusal is a different cause and stays red.
          if gh pr view --repo "$REPO" "$number" --json comments \
            --jq '.comments[].body' | grep -qx '@dependabot rebase'; then
            echo "::error::#${number} still refuses to merge after a rebase"
            exit 1
          fi
          echo "::notice::merge refused for #${number}; asking dependabot to rebase"
          gh pr comment --repo "$REPO" "$number" --body "@dependabot rebase"
        env:
          REPO: ${{ github.repository }}
          HEAD: ${{ github.event.workflow_run.head_branch }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
