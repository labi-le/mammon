name: release

# Builds and publishes the release APK on `v*` tag pushes and manual dispatch.
# Signing requires the KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and
# KEY_PASSWORD secrets; without them the release ships *-unsigned.apk.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # create the release + upload assets

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify the release tag matches the app versionName
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          vn=$(sed -nE 's/.*versionName = "([0-9]+\.[0-9]+\.[0-9]+)".*/\1/p' app/build.gradle.kts)
          echo "tag=${tag} versionName=${vn}"
          if [ "${tag}" != "${vn}" ]; then
            echo "::error::release tag v${tag} does not match app versionName ${vn}; bump versionName in app/build.gradle.kts to match the tag before releasing."
            exit 1
          fi

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      # The action's default package set is `tools platform-tools`, and Google stopped
      # serving the deprecated `tools` package on 2026-09-14, so the default now fails.
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: platform-tools

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Test and lint
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug

      - name: Assemble the release APK and the loader module zip
        run: ./gradlew --no-daemon :app:assembleRelease :app:packModuleZip

      - name: Sign and collect the release assets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          bt="${ANDROID_HOME}/build-tools/35.0.0"
          mkdir -p dist
          in="$(ls app/build/outputs/apk/release/*.apk | head -1)"
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "${KEYSTORE_BASE64}" | base64 -d > /tmp/release.jks
            out="dist/mammon-${GITHUB_REF_NAME#v}.apk"
            "$bt/zipalign" -p -f 4 "$in" "$out"
            # v4 off: its .idsig sidecar only serves incremental install and would
            # otherwise be collected as a release asset of its own.
            "$bt/apksigner" sign --v4-signing-enabled false \
              --ks /tmp/release.jks --ks-pass "env:KEYSTORE_PASSWORD" \
              --ks-key-alias "${KEY_ALIAS}" --key-pass "env:KEY_PASSWORD" "$out"
            "$bt/apksigner" verify "$out"
          else
            echo "::warning::no KEYSTORE_BASE64 secret; shipping an UNSIGNED APK"
            cp "$in" "dist/mammon-${GITHUB_REF_NAME#v}-unsigned.apk"
          fi
          # magisk-module/README.md tells users to fetch this asset by name, so the
          # module's own version names it rather than the app tag.
          mv="$(sed -nE 's/^version=(.*)$/\1/p' magisk-module/module.prop)"
          cp app/build/tmp/packModuleZip/mammon-module.zip "dist/mammon-fsloader-${mv}.zip"
          ls -l dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
